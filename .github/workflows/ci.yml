name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PandA.slnx

      - name: Build (warnings as errors)
        run: dotnet build PandA.slnx --no-restore -c Release

      - name: Backend unit tests
        run: dotnet test tests/PandA.Tests/PandA.Tests.csproj --no-build -c Release

      - name: UI component tests (bUnit)
        run: dotnet test tests/PandA.UI.Tests/PandA.UI.Tests.csproj --no-build -c Release

      - name: Install Playwright browsers
        shell: pwsh
        run: tests/PandA.E2E.Tests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: End-to-end screen-load tests (Playwright)
        run: dotnet test tests/PandA.E2E.Tests/PandA.E2E.Tests.csproj --no-build -c Release
